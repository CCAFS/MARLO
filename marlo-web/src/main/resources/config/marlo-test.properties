#---------------------------------------------------
# Amazon Cognito -- CGIAR authentication (CHG-COGNITO-AUTH-001)
#
# Every one of these keys is OPTIONAL AT CODE LEVEL. APConfig declares them as ${key:} with an
# empty default, so the application starts normally when they are absent -- which is the state of
# every environment that has not enabled Cognito. Leave them blank until a Global Unit is
# switched on via the cognito_auth_active specificity.
#
# In deployed environments these are supplied as ENVIRONMENT VARIABLES, not from this file.
# cognito.client.secret in particular is a credential: never commit a real value (hard rule 12).
#
# cognito.identity.provider is the ONE EXCEPTION to "blank is a safe default" (T15): blank is only
# safe while Cognito is disabled. In ANY environment where cognito_auth_active is switched on for a
# Global Unit, this key is REQUIRED -- leaving it blank does not fail closed. The application starts,
# logs nothing, and every CGIAR user is dropped on Cognito's own Hosted UI provider-selection screen
# instead of being routed straight to the corporate IdP, because /oauth2/authorize was never told
# which provider to use. Absent is not equivalent to disabled here; it is the wrong screen.
#---------------------------------------------------
cognito.user.pool.id=
cognito.region=
cognito.client.id=
cognito.client.secret=
cognito.domain=
cognito.callback.url=
cognito.jwks.uri=
cognito.identity.provider=
